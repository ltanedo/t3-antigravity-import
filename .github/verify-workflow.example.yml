name: Verify public source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  companion:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/paths.test.mjs tests/package.test.mjs
      - run: python scripts/verify-public.py
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/prepare_checkout.py --destination ../t3-patch-check
